<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Login · LifeRise</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <div class="auth-shell">
    <div class="brand-row"><span class="brand-dot"></span><strong>LifeRise</strong></div>
    <h1>Client login</h1>
    <p class="lead">Sign in to view your notes, track your goals, request a call with your coach, and chat with your goal-coaching assistant.</p>
    <form data-login-form>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p class="form-message" data-login-message hidden></p>
    </form>
    <p class="switch-link">First time here after signing up? <a href="activate.html">Activate your account</a></p>
  </div>

  <script src="js/portal-auth.js"></script>
</body>
</html>
